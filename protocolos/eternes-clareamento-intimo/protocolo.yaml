paginas:
  # Página 2 — o ritual + 01 Purificar (sabonete)
  - - texto:
        titulo: O Ritual
        paragrafos:
          - A pele da **região íntima** é mais fina, mais úmida e mais reativa que a do rosto. O escurecimento da virilha, da vulva e do períneo vem do **atrito**, da **depilação**, das **alterações hormonais** e da **inflamação de baixo grau**. Por isso, o cuidado precisa clarear **sem agredir**, respeitando o **pH ácido** e a microbiota da região.
          - O protocolo segue três tempos, **purificar**, **clarear** e **revitalizar**, que se completam e podem ser usados juntos desde o primeiro dia.
    - espaco: 4
    - formula:
        etapa: { numero: "01", nome: Purificar }
        nome: Sabonete Íntimo Clareador
        subtitulo: pH fisiológico 4,5
        via: OUT
        periodo: [dia, noite]
        ativos:
          - { nome: Ácido mandélico, dose: "2,5%", destaque: true }
          - { nome: Niacinamida, dose: 2% }
          - { nome: Ácido kójico, dose: 1%, destaque: true }
          - { nome: Camomila extrato glicólico, dose: 5% }
          - { nome: D-pantenol, dose: 2% }
          - { nome: BioEcolia®, dose: 1%, destaque: true }
          - { nome: "Sabonete líquido íntimo pH 4,5", dose: 150ml }
        modo_de_uso: Lavar a região íntima externa (virilha, vulva e períneo) 1 a 2 vezes ao dia, deixar a espuma agir por 1 minuto e enxaguar bem. Não aplicar no interior da vagina.
    - destaques:
        - nome: Ácido mandélico
          texto: Alfa-hidroxiácido de **molécula grande**, que penetra devagar e por isso é o mais **bem tolerado** pelas áreas sensíveis. Renova a camada superficial da pele, **afina o acúmulo de melanina** e prepara a região para os ativos do creme.
        - nome: Ácido kójico
          texto: Inibe a **tirosinase** ao se ligar ao cobre da enzima. No sabonete, atua em **contato breve** e diário, somando ao clareamento sem irritar.
        - nome: BioEcolia®
          texto: '**Prebiótico** que protege a flora benéfica enquanto limpa: o sabonete higieniza **sem desequilibrar a microbiota** íntima, prevenindo odor e irritação.'

  # Página 3 — 02 Clarear (creme, referência Pigmentbio Sensitive Areas)
  - - formula:
        etapa: { numero: "02", nome: Clarear }
        nome: Creme Clareador Íntimo
        subtitulo: referência Pigmentbio® Sensitive Areas
        via: OUT
        periodo: noite
        ativos:
          - { nome: Azeloglicina, dose: 10%, destaque: true }
          - { nome: 4-n-butilresorcinol, dose: "0,2%", destaque: true }
          - { nome: Alcaçuz extrato, dose: "0,1%", destaque: true }
          - { nome: Ácido tranexâmico, dose: 3% }
          - { nome: Niacinamida, dose: 4% }
          - { nome: Ácido salicílico, dose: "0,1%" }
          - { nome: BioEcolia®, dose: 1% }
          - { nome: Bisabolol, dose: 1% }
          - { nome: Vitamina E, dose: "0,5%" }
          - { nome: Creme não iônico (airless opaco), dose: 30g }
        modo_de_uso: À noite, com a pele limpa e seca, aplicar uma camada fina na virilha, na vulva externa, no períneo e na região perianal. Pode ser usado também nas axilas. Evitar mucosas e não usar logo após a depilação.
    - destaques:
        - nome: Azeloglicina
          texto: Derivado **hidrossolúvel do ácido azelaico**, o mesmo princípio do **Pigmentbio® Sensitive Areas** (que usa o azelato de lisina). Inibe a tirosinase de forma **seletiva nos melanócitos hiperativos**, tem ação **anti-inflamatória** e é muito mais **suave** que o ácido azelaico puro, sem ardor.
        - nome: 4-n-butilresorcinol
          texto: Um dos inibidores de **tirosinase** mais potentes da dermatologia, com **eficácia clínica** comprovada em melasma. Em dose baixa, dá **força ao clareamento** sem perder a tolerância.
        - nome: Alcaçuz
          texto: Extrato de **Glycyrrhiza glabra**, presente no Pigmentbio®, rico em **glabridina** e ácido glicirrízico. **Clareia** e **acalma** ao mesmo tempo, reduzindo a vermelhidão que antecede a mancha.
    - texto:
        paragrafos:
          - O **ácido tranexâmico** interrompe o **escurecimento pós-inflamatório** causado por depilação e atrito, e a **niacinamida** bloqueia a transferência da melanina. Como no Pigmentbio®, o **ácido salicílico** em microdose renova a superfície, o **BioEcolia®** faz o papel dos **açúcares prebióticos** e a **vitamina E** protege da oxidação. Sem **hidroquinona, retinoides ou ácido glicólico**.

  # Página 4 — 03 Revitalizar (creme hidratante vulvar, uso externo)
  - - formula:
        etapa: { numero: "03", nome: Revitalizar }
        nome: Creme Íntimo Revitalizante
        subtitulo: hidratação e regeneração da vulva
        via: OUT
        periodo: dia
        ativos:
          - { nome: Ácido hialurônico, dose: "0,5%", destaque: true }
          - { nome: Madecassoside, dose: "0,2%", destaque: true }
          - { nome: BioEcolia®, dose: 1%, destaque: true }
          - { nome: D-pantenol, dose: 5% }
          - { nome: Aroeira extrato glicólico, dose: 5% }
          - { nome: Vitamina E, dose: 2% }
          - { nome: Creme hidratante não iônico, dose: 30g }
        modo_de_uso: Uso externo. Aplicar uma pequena quantidade nos grandes e pequenos lábios e na entrada da vagina pela manhã, após o banho, e sempre que sentir ressecamento. Não introduzir na vagina.
    - destaques:
        - nome: Ácido hialurônico
          texto: Retém até **mil vezes o seu peso em água** e forma um filme que **hidrata e dá elasticidade** à pele da vulva por horas, aliviando o **ressecamento**, o **ardor** e o desconforto na relação.
        - nome: Madecassoside
          texto: Molécula ativa da **Centella asiatica** que estimula os fibroblastos a produzir **colágeno**, **regenera o tecido** e reduz a **inflamação**. Devolve **firmeza e viço** à pele íntima afinada pelo tempo e pela queda hormonal.
        - nome: BioEcolia®
          texto: '**Prebiótico** que alimenta seletivamente as **bactérias benéficas** da pele e dificulta o crescimento das indesejadas, mantendo a **microbiota íntima em equilíbrio**.'
    - texto:
        paragrafos:
          - 'O **D-pantenol** e a **vitamina E** reforçam a barreira e protegem o tecido, e a **aroeira** acalma com ação **anti-inflamatória e antimicrobiana**. A fórmula é **livre de hormônios e de fitoestrogênios**.'

  # Página 5 — orientações
  - - texto:
        titulo: O cuidado no dia a dia
        paragrafos:
          - '**Manhã:** sabonete íntimo no banho e, em seguida, o creme revitalizante na vulva.'
          - '**Noite:** sabonete íntimo e, com a pele seca, o creme clareador nas áreas escurecidas. O creme revitalizante pode ser reaplicado à noite nos lábios, se houver ressecamento.'
          - Os primeiros resultados no tom da pele aparecem entre **4 e 8 semanas**, e o resultado pleno entre **3 e 4 meses**. A hidratação e o conforto melhoram já nas **primeiras semanas** de creme revitalizante.
    - texto:
        titulo: Para potencializar
        paragrafos:
          - Preferir **roupas íntimas de algodão** e peças menos justas, que reduzem o atrito.
          - Trocar a lâmina por **depilação a laser** sempre que possível. A cada depilação, suspender o creme clareador por **48 horas**.
          - Manter a região **seca e ventilada** e evitar duchas vaginais e sabonetes comuns, que alteram o pH.
    - texto:
        titulo: Atenção
        paragrafos:
          - Suspender o uso se houver **ardor persistente**, vermelhidão ou descamação intensa. Não usar sobre **feridas**, fissuras ou durante **infecção vaginal** ativa.
          - Todas as fórmulas são de **uso externo** e **livres de hormônios**. Em gestação e amamentação, usar apenas com orientação médica.
