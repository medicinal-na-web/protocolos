parceiro:
  nome: Eternes Club
  cabecalho: Clareamento Íntimo
  assinatura: Dra. Mariana Amalia
  lema: Um ritual de cuidado íntimo em três tempos, para uniformizar o tom, preservar o equilíbrio e devolver viço à pele mais sensível do corpo.
capa_titulo: [Clareamento, Íntimo]
