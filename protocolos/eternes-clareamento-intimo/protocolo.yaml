# Guia de Formulações — ETERNES CLUB · Clareamento Íntimo (Dra. Mariana Amalia)
# Protocolo gerado pelas regras do motor NEXUS (FGTS → NAF → BAC), banco supabase_ativos. Sessão 2026.11.05
# Âncoras definidas pelo prescritor (NAF-06 / GER-04):
#   F1 sabonete  (TP4)  → ácido clareador suave: Ácido mandélico (50210)
#   F2 creme     (TP2)  → ativo do Pigmentbio Sensitive Areas (azelato de lisina): Azeloglicina (2012)
#                          + 4-n-butilresorcinol (587) 0,2% por pedido da prescritora + demais ativos do Pigmentbio:
#                          ácido salicílico 0,1%, alcaçuz, tocoferol e prebiótico (BioEcolia no lugar de ramnose/xilitol/manitol/FOS)
#                          Retirados: Belides, LumiPure Unify (decisão da prescritora) e alfa-arbutin (redundante com o butilresorcinol)
#   F3 hidratante (TP2, uso externo) → Ácido hialurônico em pó (5690) 0,5% + Madecassoside (8616) 0,2%
#   (promestrieno: sem estoque · genisteína e S-equol: retirados por serem isoflavonas de soja)
#   BioEcolia (8376) 1% incluída no F1 e no F3 a pedido da prescritora
