  # Página 5
  - - formula:
        nome: Modulador da Microbiota
        via: IN
        ativos:
          - { nome: DERMMA Biotic, dose: 100mg, destaque: true }
          - { nome: Newbiome, dose: 200mg, destaque: true }
          - { nome: Bifidum Adolescentis, dose: 1BLH }
