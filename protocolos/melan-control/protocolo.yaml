          - { nome: Fluocinolona, dose: "0,025%" }
          - { nome: Tretinoína, dose: "0,025%" }
          - { nome: Vitamina E, dose: 3% }
          - { nome: Creme clareador, dose: 30g }
        modo_de_uso: Aplicar na face à noite após higienização.
    - destaques:
        - nome: Nikkol VC-IP®
          texto: É o derivado **lipossolúvel da Vitamina C** na forma de éster que apresenta **alta estabilidade** e **excelente absorção percutânea**, possui potente ação antioxidante, contribuindo para a **uniformização do tom da pele**, por **inibir** a atividade da **tirosinase**.
        - nome: 4-HR (Hexilresorcinol)®
          texto: Atua como inibidor da **tirosinase**, a enzima chave na **produção de melanina**, com eficácia no **clareamento** e **uniformização do tom da pele**. Essa abordagem, aliada à sua capacidade **antioxidante**.
        - nome: POMC-BlocK®
          texto: Atua na **inibição** da **expressão gênica** da **POMC** e da **tirosinase**, suprimindo a **melanogênese** para impedir a síntese e a transferência da melanina, **reduzindo as hiperpigmentações cutâneas**.

