    - destaques:
        - nome: Newbiome®
          texto: É um **posbiótico avançado**, padronizado em 50% de tributirina microencapsulada em pó, que serve como uma **fonte de butirato** altamente biodisponível e **sem odor** para a **saúde intestinal**. Atua de forma sinérgica no manejo da distensão abdominal, abordando mecanismos centrais como **disbiose intestinal, inflamação de baixo grau e disfunção da barreira intestinal**.
        - nome: DERMMA Biotic®
          texto: É a combinação de **8 cepas probióticas** selecionadas em concentrações balanceadas, desenvolvidas para atuarem no **eixo intestino-pele**, promovendo a **saúde cutânea e capilar**.
    - texto:
        etiqueta: [Eixo, Intestino - Pele]
        imagem: { src: eixo-intestino-pele.png, largura: 112 }
        paragrafos:
          - O **eixo intestino–pele** é a conexão direta entre a saúde intestinal e a saúde da pele. Ele envolve microbiota, sistema imunológico, **inflamação**, **metabolismo hormonal** e até **estresse oxidativo**, todos fatores que influenciam o **melasma**. No caso do melasma, essa relação é especialmente importante porque estamos falando de uma condição **inflamatória e multifatorial**, não apenas estética.
