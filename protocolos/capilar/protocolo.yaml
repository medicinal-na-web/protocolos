          texto: Abre **canais de potássio** na musculatura dos vasos e na papila dérmica, aumenta o fluxo sanguíneo e **prolonga a fase anágena**. Por via oral é ativado pela **SULT1A1** do folículo e compensa a **perfusão reduzida** apontada pela **ECA** (74% dos laudos). Avaliar pressão arterial e frequência cardíaca antes e durante o uso.
    - espaco: 6
    - formula:
        nome: Fórmula 3 · Latanoprosta
        subtitulo: só com indicação genética
        via: OUT
        periodo: dia
