# Guia de Formulações — Protocolo Capilar Genético
# Fórmulas 1 a 9 da orientação interna da Medicinal para prescrição baseada em teste genético
# (GeneHair / HairCode — Bioma Genetics, 27 variantes). Frequências calculadas sobre 70 laudos
# reais de pacientes (65 homens e 5 mulheres, coletas de dez/2025 a ago/2026).
#
# Legenda da orientação: * obrigatório · ** restrito (só com indicação genética) · *** complementar.
# Rastreabilidade dos ativos (cdpro, tier, dose mais usada na farmácia) e pendências: revisao.md.

titulo: Protocolo Capilar
cor:
  escura: "#7a4416"
  clara: "#d39a55"
qr: https://medicinal.vip/protoc_Capilar?r=qr   # link a criar no medicinal.vip
capa: capa.jpg
capa_posicao: "center top"

paginas:
  # Página 2 — Introdução
  - - texto:
        titulo: Do laudo genético à fórmula
        paragrafos:
          - A **alopecia androgenética** tem cerca de **80% de herança genética**. O teste capilar analisa **27 variantes** distribuídas em cinco eixos — **sensibilidade androgênica**, **resposta aos tratamentos**, **vitaminas e micronutrientes**, **microcirculação** e **inflamação** — e mostra em quais pontos do ciclo do folículo cada paciente precisa de reforço.
          - Este guia reúne as **9 fórmulas** do protocolo Medicinal. Cada uma é **ativada, ajustada ou excluída** pelo resultado do laudo. A regra é sempre a mesma — **o laudo genético determina a composição final da prescrição**.
    - faixa:
        src: foliculo.jpg
        altura: 70
        posicao: "center 40%"
        etiqueta: [Folículo, Da raiz à genética]
    - tabela:
        titulo: Como ler as fórmulas
        colunas: [Marcação, Classe, Regra de inclusão]
        linhas:
          - ["*", Obrigatório, Sempre incluído. Só a dose varia conforme o laudo.]
          - ["**", Restrito, Só entra com **indicação genética direta** no laudo.]
          - ["***", Complementar, "Sempre incluído, na **dose mais apropriada** ao perfil."]
          - ["—", Regenerador, '**Tretinoína 0,015%** entra automaticamente quando o laudo indica estímulo regenerativo.']
        nota: Base de dados do guia — **70 laudos** de pacientes da Medicinal. As porcentagens das próximas páginas mostram em quantos pacientes cada achado apareceu.

