          - [Pygeum africanum, B, '1.229', 'AR · inflamação perifolicular']
          - [Licopeno 10%, A, '1.071', 'SRD5A2 · NQO1']
          - [Urtiga dioica, B, '468', 'SRD5A2 · AR (SHBG)']
          - [Androtase® (β-sitosterol), A, '238', 'SRD5A1 e SRD5A2 — opção para potencializar']

  # Página 5 — Fórmulas 2 e 3
  - - formula:
