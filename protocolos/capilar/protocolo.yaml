        - nome: Ciclopirox olamina
          texto: Antifúngico com ação **anti-inflamatória e quelante de ferro** que reduz a microinflamação perifolicular e a **PGD2**. É o associado **mais coprescrito** com o minoxidil em loção (2.945 vezes).
        - nome: GHK-Cu (Copper Peptide)
          texto: Tripeptídeo de cobre que **aumenta o tamanho do folículo**, estimula **VEGF** e **colágeno** e prolonga a fase anágena — resposta ao **HDAC9** e ao **LIPH** alterados.
        - nome: Adenosina
          texto: Estimula a papila dérmica a produzir **FGF-7** e **VEGF** e **engrossa o fio**. Com a cafeína, reforça a perfusão quando a **ECA** está alterada.

