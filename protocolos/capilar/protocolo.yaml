          - [GC + VDR, Vitamina D pouco funcional, 'F6 **Vitamina D 10.000 UI/dia**', 74%]
          - [MTHFR, Hipometilação + inflamação, 'F7 bloco **Metilfolato + Metilcobalamina**', 69%]
          - [FUT2, Inflamação intestinal e risco de eflúvio, 'F9 **Sachê intestinal** · F7 Metilcobalamina', 21%]
          - [ZPR1, Baixa vitamina E + triglicerídeos aumentados, 'F7 bloco **antioxidante** (Vitamina E, PQQ)', 24%]
          - [TNF-α / NQO1, Inflamação e defesa antioxidante, 'F7 bloco antioxidante · F9', 23% / 37%]
        nota: '**Fórmulas sempre presentes:** F2 (Minoxidil oral), F4 (Loção capilar) e F8 (Shampoo). As demais dependem do laudo. Frequência = pacientes com resultado intermediário ou aumentado entre os 70 laudos analisados (SRD5A2 e AR: só resultado aumentado).'

  # Página NEXUS — introdução ao motor
  - - texto:
        titulo: Motor NEXUS · âncoras e associações
        paragrafos:
          - 'Cada fórmula base pode ser **potencializada** com associações sugeridas pelo **motor NEXUS** da Medicinal. O motor parte do banco de ativos e de **mais de 2 milhões de itens manipulados** e segue sempre a mesma sequência:'
          - '**1. FGTS** — só entram ativos de relevância **S, A ou B**. **2. Forma farmacêutica** — o ativo precisa ter uso registrado na mesma forma (loção, cápsula, sachê, shampoo). **3. NAF (âncora)** — ativo com **indicação primária** em Alopecia ou Crescimento capilar. **4. BAC (associados)** — ativos com **coprescrição real** com a âncora, ranqueados pelo número de âncoras e pela frequência.'
          - Nas próximas páginas, cada fórmula ganha **variações**. Cada variação soma um módulo de associados à fórmula base e é escolhida pelo **achado genético** do laudo.
    - tabela:
        titulo: Âncoras do motor por fórmula
        colunas: [Fórmula, Forma, Âncoras (NAF · tier), Associados de maior força (BAC)]
        linhas:
          - [F1N, Cápsula, 'Saw palmetto **S** · Pygeum **B** · Androtase® **A**', 'Zinco quelato, Licopeno, Urtiga dioica']
          - [F4, Loção, 'Minoxidil sulfato **S** · Auxina Tricógena® **A** · Capilia Longa™ **B** · Alfa-estradiol **B**', 'Ciclopirox olamina, GHK-Cu, Cafeína, Nanofactor IGF']
          - [F5, Soro, 'aFGF **A** · VEGF **A** · IGF **A** · GHK-Cu **A**', 'bFGF, Follicusan™, Kopexyl, Adenosina']
          - [F7, Cápsula, 'Zinco quelato **S** · Exsynutriment **S** · L-cistina **S** · P5P **S**', 'Riboflavina, L-metionina, Ácido alfa-lipoico, Pinus pinaster']
          - [F8, Shampoo, 'Piritionato de zinco **B** · Jaborandi **B** · Auxina Tricógena® **A**', 'D-pantenol, Ácido salicílico, Cetoconazol, DefensCalp®']
          - [F9, Sachê, 'L-glutamina **S** · L. acidophilus **S** · L. rhamnosus **S**', 'Fibregum™ B, Inulina, Akkermansia, L. plantarum']
        nota: '**Coprescrições** (nas próximas tabelas) = quantas vezes o associado foi manipulado junto com a âncora, na mesma forma, no histórico da Medicinal. F2, F3 e F6 ficam fora do motor porque minoxidil oral, latanoprosta e vitamina D3 ainda não têm cadastro no banco. Para a F6, a associação recomendada é **Vitamina K2 MK-7 100 mcg** (tier S), que direciona o cálcio mobilizado pela vitamina D.'

  # Página 4 — Fórmula 1 (antiandrogênico oral)
  - - formula:
        nome: Fórmula 1 · Dutasterida
        subtitulo: via androgênica intensa
        via: IN
        periodo: dia
        ativos:
          - { nome: Dutasterida, dose: "0,5mg", destaque: true }
          - { nome: Preparar, dose: 45 doses }
        modo_de_uso: Tomar 01 cápsula **3 vezes na semana**.
    - espaco: 4
    - formula:
        nome: Fórmula 1 · Finasterida
        subtitulo: via androgênica moderada
        via: IN
        periodo: dia
        qr: false
        arte: { src: capsulas.jpg, topo: -8, direita: 2, largura: 46 }
        ativos:
          - { nome: Finasterida, dose: "1,0mg", destaque: true }
          - { nome: Preparar, dose: 90 doses }
        modo_de_uso: Tomar 01 cápsula ao dia.
    - destaques:
        - nome: Dutasterida
          texto: Inibe as **duas isoformas da 5α-redutase** (tipos 1 e 2) e reduz o DHT sérico em mais de 90%. Escolha quando o laudo mostra **intensidade androgênica alta** — **SRD5A2 aumentado** somado a **SRD5A1 alterado**, **AR (rs6152) aumentado** ou **HDAC9** alterado. Foi o perfil de **57%** dos 70 pacientes.
        - nome: Finasterida
          texto: Inibidor seletivo da **5α-redutase tipo 2**, a isoforma predominante no folículo. Indicada quando o achado androgênico é **isolado no SRD5A2** (alta conversão T → DHT), sem reforço do receptor ou da isoforma tipo 1 — **20%** dos pacientes.
    - espaco: 3
    - texto:
        paragrafos:
          - '**Escolha entre as opções:** a Fórmula 1 entra sempre que o **SRD5A2 está aumentado** (83% dos laudos). Sem achado androgênico, a Fórmula 1 não é prescrita. Uso masculino; em mulheres, só com indicação médica e contracepção eficaz.'

  # Página F1N — antiandrogênico natural (NEXUS)
  - - formula:
        nome: Fórmula 1N · Antiandrogênico Natural
        subtitulo: associação NEXUS
        via: IN
        periodo: [dia, noite]
        ativos:
          - { nome: Saw palmetto extrato seco, dose: 160mg, destaque: true }
          - { nome: Pygeum africanum, dose: 100mg }
          - { nome: Licopeno 10%, dose: 10mg, destaque: true }
          - { nome: Urtiga dioica (raiz), dose: 100mg, destaque: true }
          - { nome: Zinco quelato, dose: 30mg }
        modo_de_uso: Tomar 01 cápsula **2 vezes ao dia**. Alternativa ou adjuvante à F1 — mulheres, intolerância ou recusa aos inibidores sintéticos.
    - destaques:
        - nome: Saw palmetto
          texto: Ácidos graxos e **β-sitosterol** de Serenoa repens que inibem as **duas isoformas da 5α-redutase** e o acoplamento do DHT ao **receptor androgênico (AR)**. É a âncora tier S do motor nesta forma.
        - nome: Licopeno
          texto: Carotenoide que **reduz a expressão da 5α-redutase** e protege o folículo do estresse oxidativo. Coprescrito com o saw palmetto **1.071 vezes**.
        - nome: Urtiga dioica
          texto: A raiz **liga a SHBG** e reduz a fração livre de testosterona disponível para virar DHT — sinergia com o saw palmetto no **SRD5A2** aumentado.
    - espaco: 3
    - tabela:
