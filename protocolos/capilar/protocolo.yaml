          - [HDAC9, Amplificação da via androgênica, 'F1 Dutasterida · F4 **Tretinoína** · F5', 73%]
          - [CYP19A1, Baixa aromatase, 'F4 **Alfa-estradiol 0,025%**', 71%]
          - [PGD2 (GPR44), Forte tendência à regressão folicular, 'F4 **Cetirizina** 1% (intermediário) ou 2% (aumentado)', 73%]
          - [PTGFR, Baixa eficácia da latanoprosta, 'F3 **só** quando PTGFR preservado', 13% elegíveis]
