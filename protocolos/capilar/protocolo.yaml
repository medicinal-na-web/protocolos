        ativos:
          - { nome: Latanoprosta, dose: "0,005%", destaque: true }
          - { nome: Loção capilar, dose: qsp 100ml }
        modo_de_uso: Aplicar nas áreas indicadas **1 vez ao dia, pela manhã**.
    - destaques:
        arte: { src: locao-pente.jpg, largura: 34, fundir: false }
        itens:
        - nome: Latanoprosta
          texto: Análogo da **prostaglandina F2α** que estimula o crescimento pelo **receptor FP (PTGFR)**. Quando o PTGFR está alterado, a resposta é baixa — por isso a fórmula **só entra com PTGFR preservado**, o que aconteceu em **13%** dos laudos.

  # Página 6 — Fórmula 4 (loção capilar)
  - - formula:
        nome: Fórmula 4 · Loção Capilar
        subtitulo: minoxidil potencializado
        via: OUT
        periodo: noite
        ativos:
          - { nome: Minoxidil *, dose: 5% }
          - { nome: Finasterida *, dose: "0,10% ou 0,15%" }
          - { nome: Alfa-estradiol **, dose: "0,025%", destaque: true }
          - { nome: Cetirizina **, dose: 1% ou 2%, destaque: true }
          - { nome: Tretinoína (regenerador), dose: "0,015%", destaque: true }
          - { nome: D-Pantenol ***, dose: 2% }
          - { nome: Auxina Tricógena® ***, dose: 5% ou 10% }
          - { nome: Capilia Longa™ ***, dose: "2% ou 3,5%", destaque: true }
          - { nome: TrichoSol®, dose: qsp 100ml }
        modo_de_uso: Aplicar no couro cabeludo **1 vez ao dia, à noite**, com massagens suaves.
    - destaques:
        arte: { src: locao-bico.jpg, largura: 40, fundir: false }
        itens:
        - nome: Alfa-estradiol
          texto: Isômero do estradiol **sem ação estrogênica sistêmica**. Estimula a **aromatase** local, desviando testosterona para estradiol e reduzindo o substrato do DHT. Entra quando o **CYP19A1** indica **baixa aromatase** (71%).
        - nome: Cetirizina
          texto: Reduz a **prostaglandina D2**, sinal que leva o folículo à **regressão**. **1%** com PGD2 intermediário; **2%** com PGD2 aumentado (15% dos laudos).
        - nome: Tretinoína
          texto: '**Induz a SULT1A1**, enzima que ativa o minoxidil — reforço para os **59%** com SULT1A1 reduzida — e estimula a **renovação** folicular quando o laudo pede regeneração.'
        - nome: Capilia Longa™
          texto: '**Fito-exossomas** de Curcuma longa que bloqueiam a queda e estimulam o crescimento. Com a **Auxina Tricógena®**, sobe para a dose maior quando os eixos de **estrutura** ou **crescimento** passam de 50%.'

