        modo_de_uso: Tomar 1 cápsula pela manhã, em jejum, 30 minutos antes do café da manhã.
    - destaques:
        - nome: NADH
          texto: Forma **reduzida e ativa** da coenzima, que entra direto na **cadeia respiratória** para gerar **ATP**. Também é cofator na síntese de **dopamina e noradrenalina**, apoiando **disposição e foco**. Por ser instável em meio ácido, deve ser tomado **em jejum**.
        - nome: Teacrine®
          texto: Teacrina purificada, de estrutura semelhante à cafeína, que oferece **energia e motivação sustentadas** **sem tolerância** e sem a queda típica do estimulante.
    - formula:
