        modo_de_uso: Tomar 1 cápsula ao dia, pela manhã, em jejum.
    - destaques:
        - nome: PQQ
          texto: Pirroloquinolina quinona, que estimula a **biogênese mitocondrial** (formação de novas mitocôndrias) e protege contra o **estresse oxidativo**. Com o NADH, une **mais mitocôndrias** a **mais combustível** para elas.
        - nome: Resveratrol
          texto: Polifenol que **ativa as sirtuínas**, enzimas dependentes de NAD+ ligadas à **longevidade** e ao **reparo do DNA**. A **nicotinamida** completa a fórmula como precursora do NAD+.

