        subtitulo: antienvelhecimento e reparo de DNA
        via: IN
        periodo: dia
        qr: false
        ativos:
          - { nome: NADH, dose: 10mg }
          - { nome: PQQ (Bioactive Quinone®), dose: 10mg, destaque: true }
