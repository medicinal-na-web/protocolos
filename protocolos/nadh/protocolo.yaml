  # Página 6 — Orientações ao prescritor
  - - texto:
        titulo: Orientações ao prescritor
        paragrafos:
          - '**Posologia:** NADH de **5 a 20 mg/dia**, em dose única pela manhã e **em jejum**, pois é instável em meio ácido. As doses propostas seguem as concentrações mais prescritas com o NADH na Medicinal e podem ser ajustadas ao objetivo terapêutico, ao estado clínico e ao perfil do paciente.'
          - '**Segurança:** geralmente bem tolerado. Evitar em caso de hipersensibilidade; dados insuficientes na **gestação e lactação**. Pode **potencializar a levodopa** (sinergismo dopaminérgico). Considerar as interações próprias de cada associado, como a NAC com nitratos e a coenzima Q10 com varfarina.'
          - '**Referências:** Forsyth LM et al. Therapeutic effects of oral NADH on chronic fatigue syndrome. Ann Allergy Asthma Immunol. 1999;82(2):185-191. Birkmayer JG et al. NADH in Parkinson disease. Acta Neurol Scand. 1993;87(1):32-35. LipoAvail® NAD+ — material técnico EffePharm (estudos em animais).'
          - Material técnico destinado exclusivamente à classe prescritora. Não constitui promessa de cura ou tratamento.
